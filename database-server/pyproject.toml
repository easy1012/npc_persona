[project]
name = "hazel-database-server"
version = "0.1.0"
description = "Hazel Village PostgreSQL, pgvector, and Neo4j storage tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16",
    "neo4j>=6.2.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[tool.basedpyright]
venvPath = ".."
venv = ".venv"
