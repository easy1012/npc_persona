apiVersion: v1
kind: Secret
metadata: {name: hazel-database, namespace: hazel}
type: Opaque
stringData:
  POSTGRES_DSN: postgresql+asyncpg://hazel:replace@hazel-postgres:5432/hazel
  POSTGRES_DB: hazel
  POSTGRES_USER: hazel
  POSTGRES_PASSWORD: replace
  NEO4J_URI: bolt://hazel-neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: replace
  NEO4J_AUTH: neo4j/replace
