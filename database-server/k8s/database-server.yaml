apiVersion: apps/v1
kind: StatefulSet
metadata: {name: hazel-postgres, namespace: hazel}
spec:
  serviceName: hazel-postgres
  replicas: 1
  selector: {matchLabels: {app: hazel-postgres}}
  template:
    metadata: {labels: {app: hazel-postgres}}
    spec:
      nodeSelector: {hazel-role: database}
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{containerPort: 5432}]
          envFrom: [{secretRef: {name: hazel-database}}]
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}
            initialDelaySeconds: 30
          volumeMounts: [{name: postgres-data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: postgres-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-storage
        resources: {requests: {storage: 100Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: hazel-neo4j, namespace: hazel}
spec:
  serviceName: hazel-neo4j
  replicas: 1
  selector: {matchLabels: {app: hazel-neo4j}}
  template:
    metadata: {labels: {app: hazel-neo4j}}
    spec:
      nodeSelector: {hazel-role: database}
      containers:
        - name: neo4j
          image: neo4j:5
          ports: [{containerPort: 7687}]
          envFrom: [{secretRef: {name: hazel-database}}]
          readinessProbe:
            exec: {command: ["sh", "-c", "cypher-shell -u $NEO4J_USER -p $NEO4J_PASSWORD 'RETURN 1'"]}
            initialDelaySeconds: 30
          livenessProbe:
            tcpSocket: {port: 7687}
            initialDelaySeconds: 60
          volumeMounts: [{name: neo4j-data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: neo4j-data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-storage
        resources: {requests: {storage: 50Gi}}
