apiVersion: v1
kind: ConfigMap
metadata: {name: hazel-caddy-config, namespace: hazel}
data:
  Caddyfile: |
    :443 {
      tls internal
      handle /api/* {
        reverse_proxy hazel-api:8000
      }
      handle {
        reverse_proxy hazel-streamlit:8501
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: hazel-proxy, namespace: hazel}
spec:
  replicas: 1
  selector: {matchLabels: {app: hazel-proxy}}
  template:
    metadata: {labels: {app: hazel-proxy}}
    spec:
      nodeSelector: {hazel-role: model}
      containers:
        - name: caddy
          image: caddy:2.10
          ports: [{containerPort: 443}, {containerPort: 2019}]
          volumeMounts: [{name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true}]
          readinessProbe: {httpGet: {path: /config/, port: 2019}}
          livenessProbe: {httpGet: {path: /config/, port: 2019}, initialDelaySeconds: 20}
      volumes:
        - name: config
          configMap: {name: hazel-caddy-config}
---
apiVersion: v1
kind: Service
metadata: {name: hazel-proxy, namespace: hazel}
spec:
  type: LoadBalancer
  selector: {app: hazel-proxy}
  ports: [{name: https, port: 443, targetPort: 443}]
