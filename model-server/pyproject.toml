[project]
name = "hazel-model-server"
version = "0.1.0"
description = "Hazel Village FastAPI, Streamlit, and vLLM application server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.116",
    "langgraph>=1.0.0",
    "neo4j>=6.2.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
    "streamlit>=1.57.0",
    "uvicorn[standard]>=0.35",
]

[tool.basedpyright]
venvPath = ".."
venv = ".venv"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.15.21",
]
